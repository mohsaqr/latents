# Equivalence tests and the full-output harness compare latents with independent
# references. These development checks are excluded from the package build.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: equivalence

permissions: read-all

jobs:
  equivalence:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      LATENTS_EQUIVALENCE_REQUIRE_ALL: true
      LATENTS_EQUIVALENCE_OUTPUT: tmp/equivalence
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::numDeriv
            any::mclust
            any::MASS
            any::sandwich
            any::knitr
            any::rmarkdown
            any::glca
            any::poLCA
            any::multilevLCA
            any::depmixS4
            any::flexmix
            any::lcmm
            any::nnet
            any::nlme
            any::lme4
            any::mvtnorm
            any::LMest
            any::VGAM
            any::mice
            any::CompQuadForm
            any::tidySEM
            any::ordinal

      - name: Install current package for worker processes
        run: R CMD INSTALL .
        shell: bash

      - name: Test the equivalence harness
        run: Rscript equivalence/harness/test-harness.R

      - name: Compare every registered reference suite and output
        run: Rscript equivalence/harness/run.R

      - name: Retain full-output comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-output-equivalence
          path: tmp/equivalence/
          if-no-files-found: ignore

      - name: Run equivalence tests
        run: |
          devtools::load_all()
          results <- as.data.frame(testthat::test_dir("tests/equivalence",
                                                      load_package = "none",
                                                      stop_on_failure = TRUE))
          cat(sprintf("%d cases, %d expectations\n", nrow(results), sum(results$nb)))
        shell: Rscript {0}

      - name: Check documentation claims and retained inference references
        run: Rscript equivalence/run.R '^(claims|mplus-(inference|robust|mixture-weights|lmr)|missing-patterns)$'
