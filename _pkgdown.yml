url: https://pak.dynasite.org/latents

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Fitting models
  desc: Two-level latent profile, latent class and latent transition models.
  contents:
  - lpa
  - lca
  - multilpa
  - multilca
  - lta
  - fit_staged
  - starting_values
  - prior_control

- title: Results
  desc: Every table of a fitted model, retrieved by name.
  contents:
  - get_results
  - descriptives
  - diagnostics
  - report

- title: Evaluating a model
  contents:
  - enumerate_lpa
  - enumerate_lca
  - enumerate_classes
  - candidate_fit
  - bootstrap_lrt
  - sensitivity
  - starts_with("parameter_inference")
  - pool_imputations
  - get_results.latents_pooled
  - get_results.multilpa_additive
  - get_results.multilpa_cross_level
  - get_results.latents_family_enumeration

- title: Mixture regression and growth models
  desc: Regressions whose coefficients differ across latent classes, at one or
    two levels, for continuous, binary and count outcomes; classes of
    trajectories, with random effects within classes (growth mixture models).
  contents:
  - mixture_regression
  - enumerate_regressions
  - compare_models
  - get_results.latents_mixture_regression
  - get_results.latents_growth_mixture
  - predict.latents_mixture_regression
  - simulate.latents_mixture_regression
  - simulate.latents_growth_mixture

- title: External variables
  desc: Three-step analysis with a correction for classification error.
  contents:
  - three_step
  - r3step

- title: Plots
  contents:
  - plot_views
  - plot_enumeration
  - starts_with("plot.")

- title: Transition networks
  desc: Latent transitions handed to the tna package.
  contents:
  - get_tna
  - get_group_tna

- title: Data
  contents:
  - course_engagement
  - student_esm
  - study_hours
  - growth_scores
  - growth_schools
  - srl

- title: Methods
  desc: Standard generics for fitted models, enumeration grids and summaries.
  contents:
  - starts_with("print.")
  - starts_with("summary.")
  - starts_with("as.data.frame.")
  - starts_with("coef.")
  - starts_with("confint.")
  - starts_with("vcov.")
  - starts_with("logLik.")
  - starts_with("nobs.")
  - starts_with("predict.")

- title: Conditions
  contents:
  - latents-conditions

articles:
- title: Vignettes
  navbar: Vignettes
  contents:
  - lpa
  - lca
  - lta

- title: Guides
  navbar: Guides
  contents:
  - articles/workflow-lpa
  - articles/workflow-lca
  - articles/evaluation
  - articles/covariates
  - articles/mixture-regression
  - articles/trajectory-classes
  - articles/growth-mixture
  - articles/additive

- title: Case studies
  navbar: Case studies
  contents:
  - articles/case-engagement-profiles
  - articles/case-engagement-evaluation
  - articles/case-engagement-covariates
  - articles/case-engagement-transitions
  - articles/case-esm-lca
