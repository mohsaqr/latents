url: https://pak.dynasite.org/latents

template:
  bootstrap: 5

authors:
  Mohammed Saqr:
    href: https://saqr.me
  Sonsoles López-Pernas:
    href: https://sonsoles.me

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Overview
  contents:
  - latents-package

- title: Fitting models
  desc: Two-level latent profile, latent class and latent transition models.
  contents:
  - lpa
  - lca
  - multilpa
  - multilca
  - lta
  - fit_staged
  - starting_values
  - prior_control

- title: Results
  desc: Every table of a fitted model, retrieved by name.
  contents:
  - get_results
  - descriptives
  - diagnostics
  - report

- title: Evaluating a model
  contents:
  - enumerate_lpa
  - enumerate_lca
  - enumerate_classes
  - get_candidate
  - bootstrap_lrt
  - sensitivity
  - starts_with("parameter_inference")
  - pool_imputations

- title: Mixture regression and growth models
  desc: Regressions whose coefficients differ across latent classes, at one or
    two levels, for continuous, binary and count outcomes; classes of
    trajectories, with random effects within classes (growth mixture models).
  contents:
  - mixture_regression
  - enumerate_regressions
  - compare_models
  - latents-predict

- title: External variables
  desc: Three-step analysis with a correction for classification error.
  contents:
  - three_step
  - r3step

- title: Plots
  contents:
  - latents-plots

- title: Transition networks
  desc: Latent transitions handed to the tna package.
  contents:
  - get_tna
  - get_group_tna

- title: Data
  contents:
  - course_engagement
  - student_esm
  - study_hours
  - growth_scores
  - growth_schools
  - srl

- title: Methods
  desc: Coefficients, covariance, intervals and likelihood of a fit.
  contents:
  - latents-model-methods

- title: Conditions
  contents:
  - latents-conditions

