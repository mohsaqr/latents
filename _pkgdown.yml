url: https://pak.dynasite.org/latents

template:
  bootstrap: 5

authors:
  Mohammed Saqr:
    href: https://saqr.me
  Sonsoles López-Pernas:
    href: https://sonsoles.me

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
- title: Overview
  contents:
  - latents-package

- title: Fitting models
  desc: Two-level latent profile, latent class and latent transition models.
  contents:
  - lpa
  - lca
  - multilpa
  - multilca
  - lta
  - fit_staged
  - starting_values
  - prior_control

- title: Results
  desc: Every table of a fitted model, retrieved by name.
  contents:
  - get_results
  - descriptives
  - diagnostics
  - report
  - overview
  - get_checks
  - get_entropy
  - get_classification
  - get_avepp
  - get_residuals
  - get_replication

- title: Evaluating a model
  contents:
  - enumerate_lpa
  - enumerate_lca
  - enumerate_classes
  - get_candidate
  - get_candidates
  - get_best
  - get_deltas
  - get_knees
  - get_tree
  - bootstrap_lrt
  - sensitivity
  - align_labels
  - starts_with("parameter_inference")
  - pool_imputations

- title: Mixture regression and growth models
  desc: Regressions whose coefficients differ across latent classes, at one or
    two levels, for continuous, binary and count outcomes; classes of
    trajectories, with random effects within classes (growth mixture models).
  contents:
  - mixture_regression
  - enumerate_regressions
  - compare_models
  - latents-predict

- title: External variables
  desc: Three-step analysis with a correction for classification error.
  contents:
  - three_step
  - r3step

- title: Plots of a fit
  desc: One function per picture; each takes any fit that has the view.
  contents:
  - plot_profiles
  - plot_bars
  - plot_heatmap
  - plot_raincloud
  - plot_parallel
  - plot_pairs
  - plot_responses
  - plot_prevalence
  - plot_sequences
  - plot_transitions
  - plot_trajectories
  - plot_individuals
  - plot_coefficients
  - plot_classification
  - plot_all

- title: Classification plots
  desc: The four classification views, for a fit of any family or a grid.
  contents:
  - plot_sizes
  - plot_posteriors
  - plot_entropy
  - plot_avepp
  - plot_diagnostics

- title: Plots of a candidate grid
  contents:
  - plot_criteria
  - plot_enumeration
  - plot_selection
  - plot_deltas
  - plot_trust
  - plot_tree
  - plot_views

- title: Transition networks
  desc: Latent transitions handed to the tna package.
  contents:
  - get_tna
  - get_group_tna

- title: Data
  contents:
  - course_engagement
  - student_esm
  - study_hours
  - growth_scores
